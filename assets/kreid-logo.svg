<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Crown Icon -->
  <path d="M 210 120 L 225 150 L 250 110 L 275 150 L 290 120 L 280 165 L 220 165 Z" fill="#d4af37" />
  <rect x="220" y="168" width="60" height="6" rx="2" fill="#d4af37" />

  <!-- Monogram KR -->
  <g fill="none" stroke="#d4af37" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical K Stem -->
    <path d="M 205 190 L 205 310" />
    <!-- Upper K Arm & R Loop -->
    <path d="M 205 245 C 235 220, 275 220, 275 250 C 275 275, 240 280, 205 280" />
    <!-- Lower R Flourish Leg -->
    <path d="M 235 270 Q 275 300, 310 320" />
  </g>

  <!-- KREID Text -->
  <text x="250" y="375" font-family="'Outfit', 'Times New Roman', serif" font-size="42" font-weight="700" fill="#d4af37" letter-spacing="8" text-anchor="middle">KREID</text>

  <!-- COUTURE Subtitle -->
  <line x1="140" y1="405" x2="200" y2="405" stroke="#d4af37" stroke-width="2" />
  <text x="250" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#d4af37" letter-spacing="6" text-anchor="middle">COUTURE</text>
  <line x1="300" y1="405" x2="360" y2="405" stroke="#d4af37" stroke-width="2" />

  <!-- Tagline -->
  <text x="250" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#a0a0b0" letter-spacing="3" text-anchor="middle">STYLE . QUALITY . CONFIDENCE</text>
</svg>
